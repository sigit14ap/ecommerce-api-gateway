apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asia-southeast2-docker.pkg.dev/YOUR_PROJECT_ID/ecommerce-microservices-repo/api-gateway:latest
          ports:
            - containerPort: 8080